# Media Bridge HTTPS 예시 overlay. 자동 적용하지 않으며 운영자가 검토 후 opt-in한다.
services:
  media-bridge-https-example:
    image: ${MEDIA_BRIDGE_HTTPS_PROXY_IMAGE:?Set an exact reverse-proxy image tag and digest}
    profiles: [https-example]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - ${MEDIA_BRIDGE_HTTPS_BIND:-127.0.0.1:8443}:443
    networks: [product, egress]
    volumes:
      - ${MEDIA_BRIDGE_HTTPS_CONFIG:?Set a reviewed proxy config}:/etc/media-bridge-proxy.conf:ro
      - ${MEDIA_BRIDGE_HTTPS_CERTS:?Set a certificate directory}:/etc/media-bridge-certs:ro
