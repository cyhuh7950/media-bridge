name: Build linux-x64 runtime artifact

on:
  push:
    tags:
      - 'runtime-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Runtime version in x.y.z format
        required: true
        default: 0.1.13
  workflow_call:
    inputs:
      version:
        description: Runtime version in x.y.z format
        required: true
        type: string
      source_commit:
        description: Exact 40-character source commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate runtime inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            RUNTIME_VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RUNTIME_VERSION="${GITHUB_REF_NAME#runtime-v}"
          else
            echo "runtime version input is required" >&2
            exit 2
          fi
          [[ "$RUNTIME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid runtime version: $RUNTIME_VERSION" >&2; exit 2; }
          [[ "$INPUT_SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_commit must be a full 40-character SHA" >&2; exit 2; }
          echo "RUNTIME_VERSION=$RUNTIME_VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=${INPUT_SOURCE_COMMIT,,}" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create isolated build environment
        run: |
          python -m venv "$RUNNER_TEMP/media-bridge-runtime-venv"
          "$RUNNER_TEMP/media-bridge-runtime-venv/bin/python" -m pip install -r packaging/runtime/requirements-build.lock
          "$RUNNER_TEMP/media-bridge-runtime-venv/bin/python" -m pip install .
          echo "RUNTIME_BUILD_PYTHON=$RUNNER_TEMP/media-bridge-runtime-venv/bin/python" >> "$GITHUB_ENV"

      - name: Build workflow artifact
        run: |
          packaging/runtime/build-linux-x64.sh \
            --python "$RUNTIME_BUILD_PYTHON" \
            --version "$RUNTIME_VERSION" \
            --output-dir "$RUNNER_TEMP/media-bridge-runtime-output" \
            --work-dir "$RUNNER_TEMP/media-bridge-runtime-work" \
            --base-url 'http://127.0.0.1:18080'
          echo "RUNTIME_OUTPUT=$RUNNER_TEMP/media-bridge-runtime-output" >> "$GITHUB_ENV"

      - name: Run artifact contract tests
        run: node --test --test-name-pattern='runtime build|runtime verifier' tests/npm/media-bridge-linux-runtime-release.test.cjs

      - name: Verify actual runtime artifact
        run: |
          packaging/runtime/verify-linux-x64.sh \
            --artifact-dir "$RUNTIME_OUTPUT" \
            --test-root "$RUNNER_TEMP/media-bridge-runtime-verification" \
            --source-commit "$SOURCE_COMMIT"

      - name: Retain workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-bridge-runtime-linux-x64-${{ github.sha }}
          path: ${{ env.RUNTIME_OUTPUT }}/*
          if-no-files-found: error
          retention-days: 14
