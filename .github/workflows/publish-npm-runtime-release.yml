name: Publish npm runtime release

on:
  push:
    tags:
      - 'release-v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  manual-dispatch-noop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Manual dispatch is validation-only; release jobs run only for an exact release-vX.Y.Z tag.'

  prepare-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate exact release tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^release-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 2
          fi
          package_version="$(node -p "require('./packaging/npm/package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "release tag/package version mismatch: $version != $package_version" >&2
            exit 2
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build-linux-arm64:
    needs: prepare-release
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/build-runtime-linux-arm64.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}
      source_commit: ${{ github.sha }}
    permissions:
      actions: read
      contents: read

  build-linux-x64:
    needs: prepare-release
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/build-runtime-linux-x64.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}
      source_commit: ${{ github.sha }}
    permissions:
      actions: read
      contents: read

  build-win32-x64:
    needs: prepare-release
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/build-runtime-win32-x64.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}
      source_commit: ${{ github.sha }}
    permissions:
      actions: read
      contents: read

  assemble-release:
    needs:
      - prepare-release
      - build-linux-arm64
      - build-linux-x64
      - build-win32-x64
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Linux ARM64 runtime
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-runtime-linux-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-linux-arm64

      - name: Download Linux x64 runtime
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-runtime-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-linux-x64

      - name: Download Windows x64 runtime
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-runtime-win32-x64-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-win32-x64

      - name: Assemble verified release package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'release-candidate'
          node packaging/npm/scripts/assemble-candidate.cjs `
            --package-root (Join-Path $env:GITHUB_WORKSPACE 'packaging/npm') `
            --linux-arm64 (Join-Path $env:RUNNER_TEMP 'runtime-linux-arm64') `
            --linux-x64 (Join-Path $env:RUNNER_TEMP 'runtime-linux-x64') `
            --win32-x64 (Join-Path $env:RUNNER_TEMP 'runtime-win32-x64') `
            --source-commit $env:GITHUB_SHA `
            --version '${{ needs.prepare-release.outputs.version }}' `
            --output-directory $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Release assembly failed.' }
          $packOutput = npm pack --json --pack-destination $candidate (Join-Path $candidate 'package') | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed.' }
          $packed = @($packOutput | ConvertFrom-Json)
          if ($packed.Count -ne 1 -or $packed[0].filename -notmatch '\.tgz$') { throw 'npm pack did not produce exactly one tarball.' }
          if (-not (Test-Path -LiteralPath (Join-Path $candidate $packed[0].filename) -PathType Leaf)) { throw 'npm tarball is missing.' }

      - name: Retain verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: media-bridge-release-${{ needs.prepare-release.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate/**
          if-no-files-found: error
          retention-days: 14

  publish-runtime-release:
    needs:
      - prepare-release
      - assemble-release
    if: github.ref_type == 'tag' && github.ref_name == format('release-v{0}', needs.prepare-release.outputs.version)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-release-${{ needs.prepare-release.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate

      - name: Publish verified runtime assets
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_CANDIDATE: ${{ runner.temp }}/release-candidate
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = `v${process.env.VERSION}`;
            const assetsDir = path.join(process.env.RELEASE_CANDIDATE, 'runtime-artifacts');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `Media Bridge ${process.env.VERSION}`,
                body: `Verified Media Bridge runtime assets for release-v${process.env.VERSION}.`,
                draft: false, prerelease: false, make_latest: 'true',
              })).data;
            }
            const existing = (await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: release.id, per_page: 100,
            })).data;
            for (const name of fs.readdirSync(assetsDir).sort()) {
              const prior = existing.find((asset) => asset.name === name);
              if (prior) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: prior.id });
              const file = path.join(assetsDir, name);
              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }, data,
              });
            }

  publish-npm-package:
    needs:
      - prepare-release
      - assemble-release
      - publish-runtime-release
    if: github.ref_type == 'tag' && github.ref_name == format('release-v{0}', needs.prepare-release.outputs.version)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download verified package tarball
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-release-${{ needs.prepare-release.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate

      - name: Set up Node for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify exact package identity and release tag
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_CANDIDATE: ${{ runner.temp }}/release-candidate
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "release-v$VERSION" ]]
          node - "$RELEASE_CANDIDATE/package/package.json" "$VERSION" <<'NODE'
          const pkg = require(process.argv[2]);
          if (pkg.name !== '@cyhuh/media-bridge' || pkg.version !== process.argv[3]) {
            throw new Error('npm package identity/version does not match the release tag');
          }
          NODE
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE'
          const [major, minor, patch] = process.argv[2].split('.').map(Number);
          if (![major, minor, patch].every(Number.isInteger)
              || major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
            throw new Error(`npm ${process.argv[2]} is unsupported; Trusted Publishing requires npm >= 11.5.1`);
          }
          NODE

      - name: Publish verified npm tarball with OIDC
        shell: bash
        env:
          RELEASE_CANDIDATE: ${{ runner.temp }}/release-candidate
        run: npm publish "$RELEASE_CANDIDATE"/*.tgz --access public
