name: Publish npm runtime release

on:
  push:
    tags:
      - 'release-v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-runtime-release:
    runs-on: ubuntu-24.04
    env:
      VERSION: 0.1.9
      TAG: v0.1.9
      SOURCE_COMMIT: 88b0ff7597f72e99585ae00e92c9176a58977046
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Verify release trigger
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "release-v$VERSION" ]]; then
            echo "release tag/version mismatch: $GITHUB_REF_NAME != release-v$VERSION" >&2
            exit 2
          fi

      - name: Download verified Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-runtime-linux-arm64-88b0ff7597f72e99585ae00e92c9176a58977046
          path: ${{ runner.temp }}/runtime-linux-arm64
          github-token: ${{ github.token }}
          run-id: 33875592901

      - name: Download verified Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-runtime-linux-x64-88b0ff7597f72e99585ae00e92c9176a58977046
          path: ${{ runner.temp }}/runtime-linux-x64
          github-token: ${{ github.token }}
          run-id: 33875592987

      - name: Download verified Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-runtime-win32-x64-88b0ff7597f72e99585ae00e92c9176a58977046
          path: ${{ runner.temp }}/runtime-win32-x64
          github-token: ${{ github.token }}
          run-id: 33875592959

      - name: Assemble and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          release_assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_assets"
          cp "$RUNNER_TEMP/runtime-linux-arm64/media-bridge-runtime-$VERSION-linux-arm64.tar.gz" "$release_assets/"
          cp "$RUNNER_TEMP/runtime-linux-arm64/media-bridge-runtime-$VERSION-linux-arm64.tar.gz.sha256" "$release_assets/"
          cp "$RUNNER_TEMP/runtime-linux-arm64/verification-result.json" "$release_assets/verification-result-linux-arm64.json"
          cp "$RUNNER_TEMP/runtime-linux-x64/media-bridge-runtime-$VERSION-linux-x64.tar.gz" "$release_assets/"
          cp "$RUNNER_TEMP/runtime-linux-x64/media-bridge-runtime-$VERSION-linux-x64.tar.gz.sha256" "$release_assets/"
          cp "$RUNNER_TEMP/runtime-linux-x64/verification-result.json" "$release_assets/verification-result-linux-x64.json"
          cp "$RUNNER_TEMP/runtime-win32-x64/media-bridge-runtime-$VERSION-win32-x64.tar.gz" "$release_assets/"
          cp "$RUNNER_TEMP/runtime-win32-x64/media-bridge-runtime-$VERSION-win32-x64.tar.gz.sha256" "$release_assets/"
          cp "$RUNNER_TEMP/runtime-win32-x64/verification-result.json" "$release_assets/verification-result-win32-x64.json"
          cp packaging/npm/runtime-manifest.json "$release_assets/runtime-manifest.json"
          for checksum in "$release_assets"/*.sha256; do
            (cd "$release_assets" && sha256sum --check "$(basename "$checksum")")
          done
          node - "$release_assets" "$VERSION" "$SOURCE_COMMIT" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const [root, version, sourceCommit] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'runtime-manifest.json'), 'utf8'));
          if (manifest.packageVersion !== version) throw new Error('runtime manifest version mismatch');
          for (const platform of ['linux-arm64', 'linux-x64', 'win32-x64']) {
            const entry = manifest.artifacts?.[platform];
            const archive = path.join(root, `media-bridge-runtime-${version}-${platform}.tar.gz`);
            const actual = crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex');
            if (!entry?.published || entry.sha256 !== actual) throw new Error(`${platform} manifest SHA mismatch`);
            const verification = JSON.parse(fs.readFileSync(path.join(root, `verification-result-${platform}.json`), 'utf8'));
            if (verification.sourceCommit !== sourceCommit || verification.sha256 !== actual || verification.healthStatus !== 200) {
              throw new Error(`${platform} verification evidence mismatch`);
            }
          }
          NODE
          echo "RELEASE_ASSETS=$release_assets" >> "$GITHUB_ENV"

      - name: Publish verified runtime release
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: |
            Media Bridge 0.1.9 fixes Solar JSON forwarding and changes the npm personal default port to 8642 while preserving explicit and managed legacy port settings.

            ## Install or update

            ```bash
            npm install -g @cyhuh/media-bridge@0.1.9
            mb init
            mb start
            mb health
            ```

            ## Changes

            - Sends Solar chat requests with the required JSON content type.
            - Uses port 8642 for new npm personal installations to avoid common port conflicts.
            - Preserves ports already saved in user configuration and the managed enterprise default.
            - Supports Windows x64, Linux x64, and Linux ARM64 native runtimes.

            ## Verification

            Native no-Python build, personal health, managed install, checksum rejection, and rollback verification passed on all three platforms. Pre-release verification passed 443 Python tests with 6 skips, 58 Node tests with 4 skips, 27 Web Console tests, Ruff, mypy, ESLint, typecheck, and the Vite build. Runtime source commit: `88b0ff7597f72e99585ae00e92c9176a58977046`. Release metadata commit: `${{ github.sha }}`.

            ## Uninstall

            ```bash
            mb uninstall --delete-config
            npm uninstall -g @cyhuh/media-bridge
            ```
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Media Bridge ${process.env.VERSION}`,
                body: process.env.RELEASE_BODY,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              })).data;
            }
            const existing = (await github.rest.repos.listReleaseAssets({
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            })).data;
            for (const name of fs.readdirSync(process.env.RELEASE_ASSETS).sort()) {
              const prior = existing.find((asset) => asset.name === name);
              if (prior) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: prior.id });
              }
              const file = path.join(process.env.RELEASE_ASSETS, name);
              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
                data,
              });
            }
