name: Publish npm runtime release

on:
  push:
    tags:
      - 'release-v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-runtime-release:
    runs-on: ubuntu-24.04
    env:
      VERSION: 0.1.12
      TAG: v0.1.12
      SOURCE_COMMIT: a746b032856d36e6a119fb427fd346f8592203af
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Verify release trigger
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "release-v$VERSION" ]]; then
            echo "release tag/version mismatch: $GITHUB_REF_NAME != release-v$VERSION" >&2
            exit 2
          fi

      - name: Download verified Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-runtime-linux-arm64-a746b032856d36e6a119fb427fd346f8592203af
          path: ${{ runner.temp }}/runtime-linux-arm64
          github-token: ${{ github.token }}
          run-id: 33982776204

      - name: Download verified Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-runtime-linux-x64-a746b032856d36e6a119fb427fd346f8592203af
          path: ${{ runner.temp }}/runtime-linux-x64
          github-token: ${{ github.token }}
          run-id: 33982776210

      - name: Download verified Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-runtime-win32-x64-a746b032856d36e6a119fb427fd346f8592203af
          path: ${{ runner.temp }}/runtime-win32-x64
          github-token: ${{ github.token }}
          run-id: 33982776205

      - name: Assemble and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          release_assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_assets"
          cp "$RUNNER_TEMP/runtime-linux-arm64/media-bridge-runtime-$VERSION-linux-arm64.tar.gz" "$release_assets/"
          cp "$RUNNER_TEMP/runtime-linux-arm64/media-bridge-runtime-$VERSION-linux-arm64.tar.gz.sha256" "$release_assets/"
          cp "$RUNNER_TEMP/runtime-linux-arm64/verification-result.json" "$release_assets/verification-result-linux-arm64.json"
          cp "$RUNNER_TEMP/runtime-linux-x64/media-bridge-runtime-$VERSION-linux-x64.tar.gz" "$release_assets/"
          cp "$RUNNER_TEMP/runtime-linux-x64/media-bridge-runtime-$VERSION-linux-x64.tar.gz.sha256" "$release_assets/"
          cp "$RUNNER_TEMP/runtime-linux-x64/verification-result.json" "$release_assets/verification-result-linux-x64.json"
          cp "$RUNNER_TEMP/runtime-win32-x64/media-bridge-runtime-$VERSION-win32-x64.tar.gz" "$release_assets/"
          cp "$RUNNER_TEMP/runtime-win32-x64/media-bridge-runtime-$VERSION-win32-x64.tar.gz.sha256" "$release_assets/"
          cp "$RUNNER_TEMP/runtime-win32-x64/verification-result.json" "$release_assets/verification-result-win32-x64.json"
          node - "$release_assets" "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const [root, version] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(path.join(process.cwd(), 'packaging/npm/runtime-manifest.json'), 'utf8'));
          if (manifest.packageVersion !== version) throw new Error('runtime manifest version mismatch');
          for (const platform of ['linux-arm64', 'linux-x64', 'win32-x64']) {
            const archive = path.join(root, `media-bridge-runtime-${version}-${platform}.tar.gz`);
            const actual = crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex');
            const entry = manifest.artifacts?.[platform];
            if (!entry) throw new Error(`${platform} manifest entry missing`);
            entry.version = version;
            entry.published = true;
            entry.sha256 = actual;
            entry.url = `https://github.com/cyhuh7950/media-bridge/releases/download/v${version}/media-bridge-runtime-${version}-${platform}.tar.gz`;
          }
          fs.writeFileSync(path.join(root, 'runtime-manifest.json'), JSON.stringify(manifest, null, 2) + '\n');
          NODE
          for checksum in "$release_assets"/*.sha256; do
            (cd "$release_assets" && sha256sum --check "$(basename "$checksum")")
          done
          node - "$release_assets" "$VERSION" "$SOURCE_COMMIT" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const [root, version, sourceCommit] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'runtime-manifest.json'), 'utf8'));
          if (manifest.packageVersion !== version) throw new Error('runtime manifest version mismatch');
          for (const platform of ['linux-arm64', 'linux-x64', 'win32-x64']) {
            const entry = manifest.artifacts?.[platform];
            const archive = path.join(root, `media-bridge-runtime-${version}-${platform}.tar.gz`);
            const actual = crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex');
            if (!entry?.published || entry.sha256 !== actual) throw new Error(`${platform} manifest SHA mismatch`);
            const verification = JSON.parse(fs.readFileSync(path.join(root, `verification-result-${platform}.json`), 'utf8'));
            if (verification.sourceCommit !== sourceCommit || verification.sha256 !== actual || verification.healthStatus !== 200) {
              throw new Error(`${platform} verification evidence mismatch`);
            }
          }
          NODE
          echo "RELEASE_ASSETS=$release_assets" >> "$GITHUB_ENV"

      - name: Publish verified runtime release
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: |
            Media Bridge 0.1.12 adds the local Provider settings and test console and publishes verified native runtimes plus the npm CLI through GitHub Actions trusted publishing (OIDC), without a long-lived npm token.

            ## Install or update

            ```bash
            npm install -g @cyhuh/media-bridge@0.1.12
            mb init
            mb start
            mb health
            ```

            ## Changes

            - Adds a loopback-only Web Console for coding-agent, Non-Vision LLM, and Vision/OCR settings.
            - Stores Provider credentials outside config and supports Linux private files plus Windows current-user DPAPI.
            - Tests LLM, OCR, and the OCR-to-text-only-to-LLM pipeline without forwarding original media.
            - Supports OpenCodex, Eoul Gateway, Chat Completions, Responses, Solar, and Upstage Document Parse presets.
            - Supports direct Codex CLI routing through Media Bridge without requiring OpenCodex or Eoul Gateway.

            ## Verification

            Native no-Python build, personal health, managed install, checksum rejection, and rollback verification passed on all three platforms. Runtime source commit: `a746b032856d36e6a119fb427fd346f8592203af`. Release metadata commit: `${{ github.sha }}`.

            ## Uninstall

            ```bash
            mb uninstall --delete-config
            npm uninstall -g @cyhuh/media-bridge
            ```
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Media Bridge ${process.env.VERSION}`,
                body: process.env.RELEASE_BODY,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              })).data;
            }
            const existing = (await github.rest.repos.listReleaseAssets({
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            })).data;
            for (const name of fs.readdirSync(process.env.RELEASE_ASSETS).sort()) {
              const prior = existing.find((asset) => asset.name === name);
              if (prior) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: prior.id });
              }
              const file = path.join(process.env.RELEASE_ASSETS, name);
              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
                data,
              });
            }

      - name: Retain generated release assets for npm publish
        uses: actions/upload-artifact@v4
        with:
          name: media-bridge-release-assets-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-npm-package:
    needs: publish-runtime-release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v6

      - name: Set up Node for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download generated runtime manifest
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-release-assets-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets

      - name: Install generated runtime manifest
        run: cp "${{ runner.temp }}/release-assets/runtime-manifest.json" packaging/npm/runtime-manifest.json

      - name: Verify npm package and release tag
        working-directory: packaging/npm
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          npm_version="$(npm --version)"
          if [[ "$package_name" != "@cyhuh/media-bridge" ]]; then
            echo "unexpected npm package: $package_name" >&2
            exit 2
          fi
          if [[ "$GITHUB_REF_NAME" != "release-v$package_version" ]]; then
            echo "release tag/package version mismatch: $GITHUB_REF_NAME != release-v$package_version" >&2
            exit 2
          fi
          node - "$npm_version" <<'NODE'
          const version = process.argv[2];
          const [major, minor, patch] = version.split('.').map(Number);
          if (![major, minor, patch].every(Number.isInteger)
              || major < 11
              || (major === 11 && minor < 5)
              || (major === 11 && minor === 5 && patch < 1)) {
            throw new Error(`npm ${version} is unsupported; Trusted Publishing requires npm >= 11.5.1`);
          }
          NODE

      - name: Verify package contents
        working-directory: packaging/npm
        run: npm pack --dry-run

      - name: Publish npm package with OIDC
        working-directory: packaging/npm
        run: npm publish --access public
