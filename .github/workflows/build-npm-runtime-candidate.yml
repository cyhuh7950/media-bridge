name: Build npm runtime candidate

on:
  push:
    branches:
      - codex/installed-reasoning-level-config
    paths:
      - '.github/workflows/build-npm-runtime-candidate.yml'
      - '.github/workflows/build-runtime-linux-arm64.yml'
      - '.github/workflows/build-runtime-linux-x64.yml'
      - '.github/workflows/build-runtime-win32-x64.yml'
      - 'media_bridge_personal/**'
      - 'packaging/npm/**'
      - 'packaging/runtime/**'
      - 'tests/npm/**'

permissions:
  actions: read
  contents: read

jobs:
  build-linux-arm64:
    uses: ./.github/workflows/build-runtime-linux-arm64.yml
    with:
      version: 0.1.14
      source_commit: ${{ github.sha }}
    permissions:
      actions: read
      contents: read

  build-linux-x64:
    uses: ./.github/workflows/build-runtime-linux-x64.yml
    with:
      version: 0.1.14
      source_commit: ${{ github.sha }}
    permissions:
      actions: read
      contents: read

  build-win32-x64:
    uses: ./.github/workflows/build-runtime-win32-x64.yml
    with:
      version: 0.1.14
      source_commit: ${{ github.sha }}
    permissions:
      actions: read
      contents: read

  assemble-candidate:
    needs:
      - build-linux-arm64
      - build-linux-x64
      - build-win32-x64
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download linux-arm64 runtime
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-runtime-linux-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-linux-arm64

      - name: Download linux-x64 runtime
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-runtime-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-linux-x64

      - name: Download win32-x64 runtime
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-runtime-win32-x64-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-win32-x64

      - name: Assemble candidate package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'candidate'
          node packaging/npm/scripts/assemble-candidate.cjs `
            --package-root (Join-Path $env:GITHUB_WORKSPACE 'packaging/npm') `
            --linux-arm64 (Join-Path $env:RUNNER_TEMP 'runtime-linux-arm64') `
            --linux-x64 (Join-Path $env:RUNNER_TEMP 'runtime-linux-x64') `
            --win32-x64 (Join-Path $env:RUNNER_TEMP 'runtime-win32-x64') `
            --source-commit $env:GITHUB_SHA `
            --version 0.1.14 `
            --output-directory $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate assembly failed.' }
          $packOutput = npm pack --json --pack-destination $candidate (Join-Path $candidate 'package') | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed.' }
          $packed = @($packOutput | ConvertFrom-Json)
          if ($packed.Count -ne 1 -or $packed[0].filename -notmatch '\.tgz$') { throw 'npm pack did not produce exactly one tarball.' }
          if (-not (Test-Path -LiteralPath (Join-Path $candidate $packed[0].filename) -PathType Leaf)) { throw 'npm pack tarball is missing.' }

      - name: Retain candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: media-bridge-npm-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/**
          if-no-files-found: error
          retention-days: 14

  verify-native-installs:
    needs: assemble-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: win32-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out candidate verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download candidate package and runtime evidence
        uses: actions/download-artifact@v4
        with:
          name: media-bridge-npm-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate

      - name: Install and verify candidate in an isolated HOME
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'candidate'
          $tarballs = @(Get-ChildItem -LiteralPath $candidate -Filter '*.tgz' -File)
          if ($tarballs.Count -ne 1) { throw "Expected one npm tarball; found $($tarballs.Count)." }
          $prefix = Join-Path $env:RUNNER_TEMP ("candidate-npm-prefix-" + [guid]::NewGuid().ToString('N'))
          npm install --offline --ignore-scripts --no-audit --no-fund --prefix $prefix $tarballs[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Offline npm install failed.' }
          node packaging/npm/scripts/verify-candidate-install.cjs `
            --install-prefix $prefix `
            --artifact-directory (Join-Path $candidate 'runtime-artifacts') `
            --test-root (Join-Path $env:RUNNER_TEMP 'candidate-install-${{ matrix.platform }}')
          if ($LASTEXITCODE -ne 0) { throw 'Native npm candidate install verification failed.' }
          if (Test-Path -LiteralPath $prefix) { Remove-Item -LiteralPath $prefix -Recurse -Force }
