name: Build linux-arm64 runtime artifact

on:
  push:
    tags:
      - 'runtime-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Runtime version in x.y.z format
        required: true
        default: 0.1.7

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve runtime version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RUNTIME_VERSION="${GITHUB_REF_NAME#runtime-v}"
          else
            RUNTIME_VERSION="$INPUT_VERSION"
          fi
          [[ "$RUNTIME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid runtime version: $RUNTIME_VERSION" >&2; exit 2; }
          echo "RUNTIME_VERSION=$RUNTIME_VERSION" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create isolated build environment
        run: |
          python -m venv "$RUNNER_TEMP/media-bridge-runtime-venv"
          "$RUNNER_TEMP/media-bridge-runtime-venv/bin/python" -m pip install -r packaging/runtime/requirements-build.lock
          "$RUNNER_TEMP/media-bridge-runtime-venv/bin/python" -m pip install .
          echo "RUNTIME_BUILD_PYTHON=$RUNNER_TEMP/media-bridge-runtime-venv/bin/python" >> "$GITHUB_ENV"

      - name: Build private workflow artifact
        run: |
          packaging/runtime/build-linux-arm64.sh \
            --python "$RUNTIME_BUILD_PYTHON" \
            --version "$RUNTIME_VERSION" \
            --output-dir "$RUNNER_TEMP/media-bridge-runtime-output" \
            --work-dir "$RUNNER_TEMP/media-bridge-runtime-work" \
            --base-url 'http://127.0.0.1:18080'
          echo "RUNTIME_OUTPUT=$RUNNER_TEMP/media-bridge-runtime-output" >> "$GITHUB_ENV"

      - name: Run artifact contract tests
        run: node --test --test-name-pattern='runtime build|runtime verifier' tests/npm/media-bridge-linux-runtime-release.test.cjs

      - name: Verify actual runtime artifact
        run: |
          packaging/runtime/verify-linux-arm64.sh \
            --artifact-dir "$RUNTIME_OUTPUT" \
            --test-root "$RUNNER_TEMP/media-bridge-runtime-verification" \
            --source-commit '${{ github.sha }}'

      - name: Retain private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-bridge-runtime-linux-arm64-${{ github.sha }}
          path: ${{ env.RUNTIME_OUTPUT }}/*
          if-no-files-found: error
          retention-days: 14
